<extend template="base.shtml">
<head id="head"></head>
<main id="main">
	<article>
		<img
			src="$site.asset('EuroZiggoSquare.webp').link()"
			alt="European Flag with the Zig logo in the center."
		>
		<div>
			<span :text="$page.custom.get('kicker')"></span>
			<h1 :text="$page.custom.get('headline')"></h1>
			<ctx :html="$page.content()"></ctx>
		</div>
	</article>

	<section>
		<h2>our initiatives →</h2>
		<ctx :loop="$page.subpages()">
			<ctx :if="$loop.it.custom.getOr('section', '').eql('mission')">
				<article>
					<ctx :if="$loop.it.custom.has('image')">
						<img
							src="$site.asset($loop.it.custom.get('image')).link()"
							alt="$loop.it.custom.getOr('image_alt', '')"
						>
					</ctx>
					<h3 :text="$loop.it.title"></h3>
					<ctx :html="$loop.it.content()"></ctx>
				</article>
			</ctx>
		</ctx>
	</section>

	<section id="join">
		<h2>join us →</h2>
		<ctx :loop="$page.subpages()">
			<ctx :if="$loop.it.custom.getOr('section', '').eql('join')">
				<article>
					<ctx :if="$loop.it.custom.has('image')">
						<img
							src="$site.asset($loop.it.custom.get('image')).link()"
							alt="$loop.it.custom.getOr('image_alt', '')"
						>
					</ctx>
					<h3 :text="$loop.it.title"></h3>
					<ctx :html="$loop.it.content()"></ctx>
				</article>
			</ctx>
		</ctx>
	</section>

	<section id="documents">
		<h2>documents →</h2>
		<ctx :loop="$page.subpages()">
			<ctx :if="$loop.it.custom.getOr('section', '').eql('documents')">
				<article>
					<ctx :if="$loop.it.custom.has('image')">
						<img
							src="$site.asset($loop.it.custom.get('image')).link()"
							alt="$loop.it.custom.getOr('image_alt', '')"
						>
					</ctx>
					<h3 :text="$loop.it.title"></h3>
					<ctx :html="$loop.it.content()"></ctx>
				</article>
			</ctx>
		</ctx>
	</section>
</main>
